bundle:
  name: datamart-pro

workspace:
  profile: DEFAULT

variables:
  catalog:
    description: "Unity Catalog name"
    default: "datamart_catalog"
  schema:
    description: "Target schema for gold tables"
    default: "gold"

targets:
  staging:
    mode: development
    default: true
    workspace:
      host: ${workspace.host}
    variables:
      catalog: "datamart_catalog_staging"

  production:
    mode: production
    workspace:
      host: ${workspace.host}
    variables:
      catalog: "datamart_catalog_prod"

resources:
  jobs:
    silver_transform_job:
      name: "DataMart Pro — Silver Transform (${bundle.target})"
      tasks:
        - task_key: silver_transform
          spark_python_task:
            python_file: ./src/pipelines/silver_transform.py
          job_cluster_key: default_cluster
      job_clusters:
        - job_cluster_key: default_cluster
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id:   "Standard_DS3_v2"
            num_workers:    2

    churn_train_job:
      name: "DataMart Pro — Churn Train (${bundle.target})"
      tasks:
        - task_key: train
          spark_python_task:
            python_file:  ./src/ml/churn_train.py
            parameters: ["--mock", "--tracking-uri", "databricks"]
          job_cluster_key: default_cluster
      job_clusters:
        - job_cluster_key: default_cluster
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id:   "Standard_DS3_v2"
            num_workers:    2
      schedule:
        quartz_cron_expression: "0 0 3 ? * MON *"   # co poniedziałek 03:00 UTC
        timezone_id: UTC
